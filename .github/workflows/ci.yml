name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import sys, json; d = json.load(sys.stdin)['devices']; ids = [dev['udid'] for rt, devs in d.items() if 'iOS' in rt for dev in devs if 'iPhone' in dev['name']]; print(ids[-1])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & test
        run: |
          xcodebuild test \
            -scheme Interlude \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO
        env:
          NSUnbufferedIO: YES

  lint:
    name: SwiftLint & SwiftFormat
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install swiftlint swiftformat
      - name: SwiftFormat (lint)
        run: swiftformat --lint .
      - name: SwiftLint
        run: swiftlint --strict
