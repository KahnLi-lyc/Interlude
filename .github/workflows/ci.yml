name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFTFORMAT_VERSION: 0.58.7
  SWIFTLINT_VERSION: 0.63.2

jobs:
  test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # 只从 xcodebuild 认可的目的地里选，避免选中未安装运行时的模拟器。
      - name: Resolve simulator
        id: sim
        run: |
          DEST=$(xcodebuild -scheme Interlude -showdestinations 2>/dev/null \
            | grep "platform:iOS Simulator" \
            | grep "name:iPhone" \
            | grep -v "placeholder" \
            | head -1)
          echo "Using: $DEST"
          UDID=$(echo "$DEST" | sed -E 's/.*id:([0-9A-F-]+).*/\1/')
          test -n "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & test
        run: |
          xcodebuild test \
            -scheme Interlude \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO
        env:
          NSUnbufferedIO: YES

  lint:
    name: SwiftLint & SwiftFormat
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # 固定与本地一致的版本，避免新版规则差异导致 CI 与本地结果不同。
      - name: Install pinned tools
        run: |
          mkdir -p "$HOME/tools" && cd "$HOME/tools"
          curl -sSL -o swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          unzip -q -o swiftformat.zip
          curl -sSL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -q -o swiftlint.zip
          chmod +x swiftformat swiftlint
          echo "$HOME/tools" >> "$GITHUB_PATH"

      - name: SwiftFormat (lint)
        run: swiftformat --version && swiftformat --lint .

      - name: SwiftLint
        run: swiftlint version && swiftlint --strict
