included:
  - Sources
  - Tests
  - Example/InterludeExample

excluded:
  - .build
  - Example/InterludeExample.xcodeproj

disabled_rules:
  - todo
  - trailing_comma
  - opening_brace
  - identifier_name

opt_in_rules:
  - closure_spacing
  - contains_over_first_not_nil
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - last_where
  - multiline_arguments
  - operator_usage_whitespace
  - overridden_super_call
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

# 状态机与视图类天然偏长，按文件拆分会割裂 MARK 分组；这里放宽到 700 行。
type_body_length:
  warning: 700
  error: 900

file_length:
  warning: 900
  error: 1200

function_body_length:
  warning: 100
  error: 150

function_parameter_count:
  warning: 8
  error: 10

large_tuple:
  warning: 3
  error: 4

cyclomatic_complexity:
  warning: 15
  error: 25

nesting:
  type_level: 3
