name: InterludeExample
options:
  bundleIdPrefix: com.kahnli
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  Interlude:
    path: ..
  LookinServer:
    url: https://github.com/QMUI/LookinServer/
    exactVersion: 1.2.8

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: "NO"

targets:
  InterludeExample:
    type: application
    platform: iOS
    sources:
      - path: InterludeExample
    dependencies:
      - package: Interlude
      - package: LookinServer
    info:
      path: InterludeExample/Info.plist
      properties:
        CFBundleDisplayName: Interlude
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kahnli.InterludeExample
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
